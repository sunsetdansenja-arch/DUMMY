<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FFI - Database History</title>
<link rel="icon" type="image/png" href="./LOGO FFI.png">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="./theme.css">
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        appbg: '#14050B', appcard: 'rgba(255,255,255,0.06)', appinput: 'rgba(255,255,255,0.08)',
        appapplered: '#E11D48', appappleblue: '#FFB3C1', appappleorange: '#FFB020', appgreen: '#4ADE80', appred: '#FF6B81'
      },
      borderRadius: { '4xl': '2rem' },
      fontFamily: { 'apple': ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'] }
    }
  }
}
</script>
<style>
.accordion-content { max-height: 0; overflow: hidden; transition: max-height .45s ease-out, opacity .35s; opacity: 0; }
.accordion-expanded { max-height: 800px; opacity: 1; border-top: 1px solid rgba(255,255,255,.10); padding-top: .75rem; margin-top: .75rem; }
.void-card { background: linear-gradient(135deg, rgba(120,10,30,.30), rgba(60,5,15,.25)) !important; }
</style>
</head>
<body class="antialiased font-apple">

<div id="toast" class="px-7 py-3 rounded-full font-extrabold text-sm flex items-center gap-3 w-max max-w-[90%] pointer-events-none border-2 bg-appcard border-appgreen text-white">
  <span id="toast-icon">✅</span><span id="toast-msg">Success</span>
</div>

<header class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="flex items-center gap-3">
      <img src="./LOGO FFI.png" alt="Logo" onerror="this.style.display='none'" class="h-8 w-auto object-contain">
      <span class="brand">Family<span>Food</span></span>
    </a>
    <nav class="nav-tabs" aria-label="Navigasi utama"><a href="index.html" class="nav-tab"><i class="fa-solid fa-house text-[11px]"></i>Lobby</a><a href="input.html" class="nav-tab"><i class="fa-solid fa-pen-to-square text-[11px]"></i>Input</a><a href="analytic.html" class="nav-tab"><i class="fa-solid fa-chart-simple text-[11px]"></i>Analytic</a><a href="data.html" class="nav-tab active"><i class="fa-solid fa-database text-[11px]"></i>Data</a><a href="report.html" class="nav-tab"><i class="fa-solid fa-file-pdf text-[11px]"></i>Laporan</a></nav>
    <button type="button" onclick="loadLogPO()" id="btn-sync-log" class="icon-btn btn-tactile" title="Sinkronisasi data" aria-label="Sinkronisasi data">
      <i class="fa-solid fa-rotate-right text-sm" id="sync-icon"></i>
    </button>
  </div>
</header>

<main class="page-wrap page-pad space-y-5 animate-fade" style="max-width: 64rem;">

  <div>
    <h1 class="page-title"><i class="fa-solid fa-database mr-2" style="color:#FF4D6A"></i>Database History</h1>
    <p class="page-sub">Riwayat PO, realisasi pengiriman, dan pembatalan.</p>
  </div>

  <!-- Search + filter (menempel di bawah header) -->
  <div class="sticky z-20 space-y-3 py-2" style="top: 4.1rem;">
    <div class="relative">
      <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
      <input type="text" id="search-po" placeholder="Cari ID PO atau DC Gudang..." onkeyup="filterLogLocal()" style="padding-left: 2.6rem; border-radius: 9999px;">
    </div>
    <div class="seg" id="status-filter">
      <button type="button" class="seg-btn active" data-f="all" onclick="setFilter('all')">Semua</button>
      <button type="button" class="seg-btn" data-f="done" onclick="setFilter('done')">Terpenuhi</button>
      <button type="button" class="seg-btn" data-f="part" onclick="setFilter('part')">Parsial</button>
      <button type="button" class="seg-btn" data-f="none" onclick="setFilter('none')">Belum Kirim</button>
      <button type="button" class="seg-btn" data-f="void" onclick="setFilter('void')">Void</button>
    </div>
    <p id="result-count" class="text-[10px] text-gray-500 font-bold uppercase tracking-widest px-2"></p>
  </div>

  <div id="log-container" class="grid grid-cols-1 lg:grid-cols-2 gap-4 items-start"></div>
</main>

<nav class="bottom-nav" aria-label="Navigasi utama"><a href="index.html" class="bn-item"><i class="fa-solid fa-house"></i>Lobby</a><a href="input.html" class="bn-item"><i class="fa-solid fa-pen-to-square"></i>Input</a><a href="analytic.html" class="bn-item"><i class="fa-solid fa-chart-simple"></i>Analytic</a><a href="data.html" class="bn-item active"><i class="fa-solid fa-database"></i>Data</a><a href="report.html" class="bn-item"><i class="fa-solid fa-file-pdf"></i>Laporan</a></nav>

<script>
const WEBHOOK_URL = "https://n8n-mzbmiib3etk4.kangkung.sumopod.my.id/webhook/ff-indonesia-api";
let activeLogData = [];
let activeFilter = 'all';

document.addEventListener('DOMContentLoaded', () => {
  if(!localStorage.getItem('ffi_user')) { window.location.href = 'index.html'; return; }
  setTimeout(() => { loadLogPO(); }, 100);
});

function showToast(msg, isError = false) {
  const t = document.getElementById('toast'); document.getElementById('toast-msg').innerText = msg; document.getElementById('toast-icon').innerText = isError ? '❌' : '✅';
  t.className = `px-7 py-3 rounded-full font-extrabold text-sm flex items-center gap-3 w-max max-w-[90%] pointer-events-none border-2 ${isError ? 'bg-[#3A0000] border-appred text-appred' : 'bg-appcard border-appgreen text-white'}`;
  t.classList.add('toast-show'); setTimeout(() => t.classList.remove('toast-show'), 3000);
}

async function sendApi(payload, btnElement = null, originalText = "") {
  if(btnElement) { btnElement.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`; btnElement.classList.add('opacity-50', 'pointer-events-none'); }
  try {
    const res = await fetch(WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    const txt = await res.text(); let data; try { data = JSON.parse(txt); } catch(e) { data = {status: "error"}; }
    if(btnElement) { btnElement.innerHTML = originalText; btnElement.classList.remove('opacity-50', 'pointer-events-none'); }
    return Array.isArray(data) ? data[0] : data;
  } catch(e) { if(btnElement) { btnElement.innerHTML = originalText; btnElement.classList.remove('opacity-50', 'pointer-events-none'); } return null; }
}

async function loadLogPO() {
  const btn = document.getElementById('btn-sync-log');
  const cont = document.getElementById('log-container');
  if(cont) cont.innerHTML = Array(4).fill(`<div class="skeleton-box rounded-3xl h-24 w-full"></div>`).join('');

  const res = await sendApi({ action: "load_admin" }, btn, `<i class="fa-solid fa-rotate-right text-sm"></i>`);
  if (res && res.status === "success") {
    activeLogData = res.data || [];
    filterLogLocal();
  } else {
    showToast("Gagal mengambil data", true);
  }
}

// Status tiap PO: void / done / part / none
function getStatus(item) {
  const isBatal = String(item["PO NKA"]).includes("BATAL") || (Number(item["TOTAL PO ctn"]||0) === 0 && (Number(item["Qty Terpenuhi (Kirim)"]||0) === 0));
  const poQty = Number(item["TOTAL PO ctn"]) || 0;
  const salesQty = Number(item["Qty Terpenuhi (Kirim)"]) || (Number(item["NKA"]||0) + Number(item["NDLH"]||0) + Number(item["NRD"]||0) + Number(item["NARR"]||0) + Number(item["NKACH"]||0));
  let status = 'none';
  if (isBatal) status = 'void';
  else if (salesQty >= (poQty * 0.85)) status = 'done';
  else if (salesQty > 0) status = 'part';
  return { isBatal, poQty, salesQty, status };
}

function setFilter(f) {
  activeFilter = f;
  document.querySelectorAll('#status-filter .seg-btn').forEach(b => b.classList.toggle('active', b.dataset.f === f));
  filterLogLocal();
}

function filterLogLocal() {
  const q = document.getElementById('search-po').value.toLowerCase();
  renderLogs(activeLogData.filter(i =>
    ((i.ID && i.ID.toLowerCase().includes(q)) || (i.DC && i.DC.toLowerCase().includes(q))) &&
    (activeFilter === 'all' || getStatus(i).status === activeFilter)
  ));
}

function renderLogs(data) {
  const cont = document.getElementById('log-container'); if(!cont) return; cont.innerHTML = '';
  document.getElementById('result-count').innerText = `${data.filter(d => d.ID).length} PO ditampilkan`;
  if(!data.length) { cont.innerHTML = `<p class="col-span-full text-center italic opacity-40 text-sm py-10">Tidak ada riwayat data...</p>`; return; }

  data.forEach((item, idx) => {
    if(!item.ID) return;
    const { isBatal, poQty, salesQty, status } = getStatus(item);
    const batchInfo = item.BATCHES || item.batches || "-";

    let border = "border-white/10", text = "text-appred", icon = "fa-circle-xmark", cardBg = "bg-appcard", badge = "";
    if (isBatal) { border = "border-appred/40"; cardBg = "bg-appcard void-card"; icon = "fa-ban"; badge = `<div class="absolute top-3 right-3 bg-appred text-black text-[8px] font-black px-2 py-0.5 rounded">VOID</div>`; }
    else if (status === 'done') { border = "border-appgreen/40"; text = "text-appgreen"; icon = "fa-circle-check"; }
    else if (status === 'part') { border = "border-appappleorange/40"; text = "text-appappleorange"; icon = "fa-clock-rotate-left"; }

    cont.innerHTML += `
      <div class="${cardBg} rounded-3xl border ${border} overflow-hidden relative animate-fade" style="animation-delay:${idx*20}ms; opacity:0">
        ${badge}
        <div class="p-5 flex items-center justify-between cursor-pointer btn-tactile" onclick="toggleCard('${item.ID}')">
          <div class="flex items-center gap-4 w-2/3">
            <div class="w-10 h-10 rounded-xl bg-black/30 flex items-center justify-center border border-white/10 shrink-0 ${isBatal?'text-appred':text}"><i class="fa-solid ${icon} text-lg"></i></div>
            <div class="min-w-0"><h4 class="font-black text-sm uppercase truncate ${isBatal?'text-gray-500':''}">${item.ID}</h4><p class="text-[10px] text-gray-400 font-bold uppercase mt-1 truncate">${item.DC} • ${item["Tanggal PO"]}</p></div>
          </div>
          <div class="text-right"><p class="text-[8px] text-gray-500 uppercase font-black tracking-widest mb-0.5">PO / SALES</p><p class="text-sm font-black ${isBatal?'text-gray-500':text}">${poQty} / ${salesQty}</p></div>
        </div>
        <div id="det-${item.ID}" class="accordion-content px-5 pb-5 pt-0">
          <div class="bg-black/30 p-2.5 rounded-xl border border-white/10 mb-3 text-center"><p class="text-[8px] text-gray-500 font-bold uppercase mb-0.5">Tag Batch Terikat</p><p class="text-[10px] text-appappleblue font-black tracking-wider uppercase">${batchInfo}</p></div>
          <div class="space-y-1.5 text-[10px] font-extrabold uppercase">
            <div class="flex justify-between bg-white/5 py-2 px-4 rounded-lg"><span class="text-gray-400">NKA</span><span>${item["PO NKA"]||0} ➔ <span class="text-appappleblue">${item["NKA"]||0}</span></span></div>
            <div class="flex justify-between bg-white/5 py-2 px-4 rounded-lg"><span class="text-gray-400">NDLH</span><span>${item["PO NDLH"]||0} ➔ <span class="text-appappleblue">${item["NDLH"]||0}</span></span></div>
            <div class="flex justify-between bg-white/5 py-2 px-4 rounded-lg"><span class="text-gray-400">NRD</span><span>${item["PO NRD"]||0} ➔ <span class="text-appappleblue">${item["NRD"]||0}</span></span></div>
            <div class="flex justify-between bg-white/5 py-2 px-4 rounded-lg"><span class="text-gray-400">NARR</span><span>${item["PO NARR"]||0} ➔ <span class="text-appappleblue">${item["NARR"]||0}</span></span></div>
            <div class="flex justify-between bg-white/5 py-2 px-4 rounded-lg"><span class="text-gray-400">NKACH</span><span>${item["PO NKACH"]||0} ➔ <span class="text-appgreen">${item["NKACH"]||0}</span></span></div>
          </div>
          <div class="flex justify-between items-center border-t border-white/10 pt-4 mt-4">
            <div><p class="text-[8px] text-gray-500 font-bold uppercase mb-0.5">GAP Supply</p><p class="text-sm font-black ${item["GAP"]==0?'text-appgreen':'text-appred'}">${item["GAP"]||0} CTN</p></div>
            <button type="button" onclick="deletePO('${item.ID}')" class="bg-appred/10 text-appred border border-appred/30 font-extrabold text-[9px] py-2 px-4 rounded-xl btn-tactile hover:bg-appred hover:text-black ${isBatal?'hidden-tab':''}"><i class="fa-solid fa-trash mr-1.5"></i>BATAL PO</button>
          </div>
        </div>
      </div>`;
  });
}

function toggleCard(id) { document.getElementById('det-' + id).classList.toggle('accordion-expanded'); }

async function deletePO(id) {
  if(!confirm(`Apakah Anda yakin ingin membatalkan/void transaksi PO: ${id}?`)) return;
  const res = await sendApi({ action: "delete", id: id });
  if(res && res.status === "success") {
    showToast(`PO ${id} Berhasil Dibatalkan!`);
    loadLogPO();
  } else {
    showToast("Gagal void data", true);
  }
}
</script>
</body>
</html>
