<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FamilyFood SC - Portal</title>
<link rel="icon" type="image/png" href="./LOGO FFI.png">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        appbg: '#14050B', appcard: 'rgba(255,255,255,0.06)', appinput: 'rgba(255,255,255,0.08)',
        appneon: '#FF4D6A', appapplered: '#E11D48', appappleblue: '#FFB3C1', appappleorange: '#FFB020',
        appgreen: '#4ADE80', appred: '#FF6B81'
      },
      borderRadius: { '3xl': '1.75rem', '4xl': '2.5rem' },
      fontFamily: { 'apple': ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'] }
    }
  }
}
</script>
<style>
#view-login, #view-lobby { display: none; }
#form-login input { border-radius: 9999px; text-align: center; padding: 1rem 1.4rem; font-weight: 800; letter-spacing: .12em; }
.module-card { display: flex; flex-direction: column; justify-content: space-between; min-height: 11rem; padding: 1.25rem; border-radius: 1.5rem; text-align: left; transition: transform .2s, border-color .2s, box-shadow .2s; }
.module-card:hover { transform: translateY(-3px); border-color: rgba(255,77,106,.6); box-shadow: 0 16px 40px rgba(225,29,72,.28), inset 0 1px 0 rgba(255,255,255,.15); }
.module-icon { width: 3rem; height: 3rem; border-radius: 1rem; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #FF4D6A, #E11D48); box-shadow: 0 8px 20px rgba(225,29,72,.4); font-size: 1.1rem; }
</style>
</head>
<body class="antialiased font-apple">

<!-- ALERT TOAST -->
<div id="toast" class="px-7 py-3 rounded-full font-extrabold text-sm flex items-center gap-3 w-max max-w-[90%] pointer-events-none border bg-appcard border-appgreen text-white">
  <span id="toast-icon">✅</span><span id="toast-msg">Success</span>
</div>

<!-- ================= LAYAR LOGIN ================= -->
<div id="view-login" class="min-h-screen flex-col justify-center items-center p-6">
  <div class="glass-card w-full max-w-sm p-8 md:p-10 animate-fade">
    <div class="text-center mb-8">
      <img src="./LOGO FFI.png" alt="Family Food Logo" onerror="this.style.display='none'" class="w-28 h-auto mx-auto mb-5 drop-shadow-[0_0_25px_rgba(255,77,106,0.35)]">
      <h1 class="brand text-2xl">Family<span>Food</span></h1>
      <p class="section-label mt-3">Secure Access Center</p>
    </div>
    <form id="form-login" onsubmit="handleLogin(event)" class="space-y-3">
      <input type="text" id="login-user" placeholder="USER ID" required class="uppercase" autocomplete="username">
      <input type="password" id="login-pass" placeholder="PASSWORD" required autocomplete="current-password">
      <button type="submit" id="btn-login" class="btn-primary btn-tactile w-full py-4 mt-3 text-xs rounded-full">MASUK SISTEM</button>
    </form>
  </div>
</div>

<!-- ================= LAYAR LOBBY ================= -->
<div id="view-lobby" class="flex-col min-h-screen page-pad">

  <header class="topbar">
    <div class="topbar-inner">
      <a href="index.html" class="flex items-center gap-3">
        <img src="./LOGO FFI.png" alt="Family Food Logo" onerror="this.style.display='none'" class="h-9 w-auto object-contain">
        <span class="brand">Family<span>Food</span></span>
      </a>
      <nav class="nav-tabs" aria-label="Navigasi utama"><a href="index.html" class="nav-tab active"><i class="fa-solid fa-house text-[11px]"></i>Lobby</a><a href="input.html" class="nav-tab"><i class="fa-solid fa-pen-to-square text-[11px]"></i>Input</a><a href="analytic.html" class="nav-tab"><i class="fa-solid fa-chart-simple text-[11px]"></i>Analytic</a><a href="data.html" class="nav-tab"><i class="fa-solid fa-database text-[11px]"></i>Data</a><a href="report.html" class="nav-tab"><i class="fa-solid fa-file-pdf text-[11px]"></i>Laporan</a></nav>
      <div class="flex items-center gap-2">
        <div class="hidden sm:flex items-center gap-2.5 glass-flat px-4 py-2 rounded-full">
          <span class="w-2 h-2 rounded-full bg-appneon animate-pulse shadow-[0_0_8px_#FF4D6A]"></span>
          <p id="header-username" class="text-[10px] text-gray-300 uppercase font-black tracking-widest">USER</p>
        </div>
        <button onclick="logout()" class="icon-btn btn-tactile hover:text-appred" title="Keluar sistem" aria-label="Keluar sistem">
          <i class="fa-solid fa-arrow-right-from-bracket text-sm"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="page-wrap w-full flex-1">
    <section class="mb-6 animate-fade">
      <p class="section-label">Dashboard</p>
      <h1 class="page-title mt-1">Halo, <span id="greet-name" class="text-appneon">USER</span> 👋</h1>
      <p class="page-sub">Pilih modul untuk mulai bekerja.</p>
    </section>

    <section class="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4">
      <button onclick="goTo('input.html')" class="module-card glass btn-tactile animate-fade">
        <div class="flex items-start justify-between">
          <span class="module-icon"><i class="fa-solid fa-plus"></i></span>
          <i class="fa-solid fa-arrow-right text-gray-500 text-xs"></i>
        </div>
        <div>
          <span class="text-sm font-black uppercase tracking-wide block">Input Operasional</span>
          <span class="text-[11px] text-gray-400 block mt-1 leading-snug">PO, sales, dan stock harian.</span>
        </div>
      </button>
      <button onclick="goTo('analytic.html')" class="module-card glass btn-tactile animate-fade" style="animation-delay:60ms">
        <div class="flex items-start justify-between">
          <span class="module-icon"><i class="fa-solid fa-chart-simple"></i></span>
          <i class="fa-solid fa-arrow-right text-gray-500 text-xs"></i>
        </div>
        <div>
          <span class="text-sm font-black uppercase tracking-wide block">Analytic &amp; QC</span>
          <span class="text-[11px] text-gray-400 block mt-1 leading-snug">Monitoring kualitas &amp; masa simpan.</span>
        </div>
      </button>
      <button onclick="goTo('data.html')" class="module-card glass btn-tactile animate-fade" style="animation-delay:120ms">
        <div class="flex items-start justify-between">
          <span class="module-icon"><i class="fa-solid fa-database"></i></span>
          <i class="fa-solid fa-arrow-right text-gray-500 text-xs"></i>
        </div>
        <div>
          <span class="text-sm font-black uppercase tracking-wide block">Database History</span>
          <span class="text-[11px] text-gray-400 block mt-1 leading-snug">Riwayat &amp; arsip data PO.</span>
        </div>
      </button>
      <button onclick="goTo('report.html')" class="module-card glass btn-tactile animate-fade" style="animation-delay:180ms">
        <div class="flex items-start justify-between">
          <span class="module-icon"><i class="fa-solid fa-file-pdf"></i></span>
          <i class="fa-solid fa-arrow-right text-gray-500 text-xs"></i>
        </div>
        <div>
          <span class="text-sm font-black uppercase tracking-wide block">Cetak Laporan</span>
          <span class="text-[11px] text-gray-400 block mt-1 leading-snug">Rekap performa &amp; unduh PDF.</span>
        </div>
      </button>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Navigasi utama"><a href="index.html" class="bn-item active"><i class="fa-solid fa-house"></i>Lobby</a><a href="input.html" class="bn-item"><i class="fa-solid fa-pen-to-square"></i>Input</a><a href="analytic.html" class="bn-item"><i class="fa-solid fa-chart-simple"></i>Analytic</a><a href="data.html" class="bn-item"><i class="fa-solid fa-database"></i>Data</a><a href="report.html" class="bn-item"><i class="fa-solid fa-file-pdf"></i>Laporan</a></nav>
</div>

<!-- CORE JAVASCRIPT LOGIC STORAGE & WEBHOOK HANDLER -->
<script>
const WEBHOOK_URL = "https://n8n-mzbmiib3etk4.kangkung.sumopod.my.id/webhook/ff-indonesia-api";

document.addEventListener('DOMContentLoaded', () => {
  const savedUser = localStorage.getItem('ffi_user');
  if(savedUser) {
    document.getElementById('view-lobby').style.display = 'flex';
    document.getElementById('header-username').innerText = savedUser;
    document.getElementById('greet-name').innerText = savedUser;
  } else {
    document.getElementById('view-login').style.display = 'flex';
  }
});

function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').innerText = msg;
  document.getElementById('toast-icon').innerText = isError ? '❌' : '✅';
  t.className = `px-7 py-3 rounded-full font-extrabold text-sm flex items-center gap-3 w-max max-w-[90%] pointer-events-none border ${isError ? 'bg-[#3A0000] border-appred text-appred' : 'bg-appcard border-appgreen text-white'}`;
  t.classList.add('toast-show');
  setTimeout(() => t.classList.remove('toast-show'), 3000);
}

async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('btn-login');
  const user = document.getElementById('login-user').value;
  const pass = document.getElementById('login-pass').value;
  btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`;
  btn.classList.add('opacity-50', 'pointer-events-none');
  try {
    const res = await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: "login", user_id: user, password: pass })
    });
    const textData = await res.text();
    let data;
    try { data = JSON.parse(textData); } catch(err) { data = { status: "error", message: textData }; }
    data = Array.isArray(data) ? data[0] : data;
    if (data && data.status === "success") {
      const uid = data.user_id || user;
      localStorage.setItem('ffi_user', uid);
      document.getElementById('view-login').style.display = 'none';
      document.getElementById('view-lobby').style.display = 'flex';
      document.getElementById('header-username').innerText = uid;
      document.getElementById('greet-name').innerText = uid;
    } else {
      showToast(data ? data.message : "Akses Ditolak", true);
    }
  } catch (err) {
    showToast("Koneksi Server Error", true);
  } finally {
    btn.innerHTML = `MASUK SISTEM`;
    btn.classList.remove('opacity-50', 'pointer-events-none');
  }
}

function logout() {
  localStorage.removeItem('ffi_user');
  location.reload();
}

function goTo(url) {
  window.location.href = url;
}
</script>
</body>
</html>
