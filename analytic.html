<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FFI - Analytic & QC</title>
    <link rel="icon" type="image/png" href="./LOGO FFI.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    colors: { 
                        appbg: '#0F1115', 
                        appcard: '#15181E', 
                        appcardsec: '#1D212A',
                        appaccent: '#9DFF00',
                        appcontrast: '#FFFFFF',
                        appborder: 'rgba(255, 255, 255, 0.05)',
                        appborderhover: 'rgba(255, 255, 255, 0.12)',
                        appred: '#FF453A', 
                        appgreen: '#32D74B',
                        apporange: '#FF9F0A'
                    }, 
                    borderRadius: { 
                        '3xl': '1rem',
                        '4xl': '1.25rem',
                        '5xl': '1.75rem'
                    },
                    fontFamily: { 
                        'apple': ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'] 
                    } 
                } 
            } 
        }
    </script>
    <style>
        body { 
            background-color: #0F1115; 
            color: #FFFFFF; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            -webkit-tap-highlight-color: transparent; 
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        .hidden-tab { display: none !important; }
        
        .btn-tactile { transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); cursor: pointer; }
        .btn-tactile:hover { transform: translateY(-1px); border-color: rgba(255, 255, 255, 0.12); }
        .btn-tactile:active { transform: translateY(0.5px) scale(0.99); }

        .skeleton-pulse-card { position: relative; overflow: hidden; background-color: #15181E; border: 1px solid rgba(255,255,255,0.03); }
        .skeleton-pulse-card::after { 
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.02), transparent); 
            animation: premiumShimmer 1.6s infinite; 
        }
        @keyframes premiumShimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
        @keyframes premiumFadeUp { 0% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: translateY(0); } }
        .animate-premium-fade { animation: premiumFadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="bg-[#0F1115] antialiased p-3 md:p-6">

    <div class="w-full max-w-7xl bg-appbg min-h-screen relative flex flex-col mx-auto md:rounded-4xl md:border border-appborder overflow-hidden shadow-2xl pb-16">
        
        <!-- HEADER -->
        <div class="px-6 py-4 sticky top-0 bg-[#0F1115]/90 backdrop-blur-md z-20 flex justify-between items-center border-b border-appborder">
            <button onclick="window.location.href='index.html'" class="text-gray-400 hover:text-white transition-all text-xs flex items-center gap-2 font-bold bg-white/5 px-3 py-2 rounded-full border border-white/5">
                <i class="fa-solid fa-arrow-left text-[10px]"></i> LOBBY
            </button>
            
            <div class="flex items-center gap-2.5 bg-white/5 border border-white/5 px-4 py-1.5 rounded-full">
                <span class="h-1.5 w-1.5 rounded-full bg-appaccent shadow-[0_0_8px_#9DFF00] animate-pulse"></span>
                <h2 class="text-xs font-black tracking-wider uppercase text-white font-apple">Analytic & QC Engine</h2>
            </div>

            <button onclick="loadAnalytics()" class="h-8 w-8 flex items-center justify-center rounded-full bg-white/5 border border-white/5 text-white hover:text-appaccent transition-all" title="Sync Live Metrics">
                <i class="fa-solid fa-rotate-right text-xs" id="sync-icon"></i>
            </button>
        </div>

        <!-- MAIN DASHBOARD -->
        <div class="p-4 md:p-6 space-y-6">
            
            <!-- METRIC HUD STATS (Top Row) -->
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="bg-appcard border border-appborder p-4 rounded-3xl group hover:border-appborderhover transition-all">
                    <p class="text-[9px] uppercase font-bold text-gray-500 tracking-wider">Total Active SKU</p>
                    <div class="flex justify-between items-baseline mt-1">
                        <p id="stat-sku" class="text-3xl font-black text-white tracking-tight group-hover:text-appaccent transition-colors">0</p>
                        <span class="text-[10px] text-gray-500 font-apple">Variants</span>
                    </div>
                </div>

                <div class="bg-appcard border border-appborder p-4 rounded-3xl group hover:border-appborderhover transition-all">
                    <p class="text-[9px] uppercase font-bold text-appaccent tracking-wider">DC Terpantau</p>
                    <div class="flex justify-between items-baseline mt-1">
                        <p id="stat-dc" class="text-3xl font-black text-white tracking-tight group-hover:text-appaccent transition-colors">0</p>
                        <span class="text-[10px] text-gray-500 font-apple">Regions</span>
                    </div>
                </div>

                <div class="bg-appcard border border-appborder p-4 rounded-3xl group hover:border-appborderhover transition-all">
                    <p class="text-[9px] uppercase font-bold text-appred tracking-wider">Critical Lifecycles</p>
                    <div class="flex justify-between items-baseline mt-1">
                        <p id="stat-grade-crit" class="text-3xl font-black text-appred tracking-tight">0</p>
                        <span class="text-[10px] text-gray-500 font-apple">&lt;= 3 Bln</span>
                    </div>
                </div>

                <div class="bg-appcard border border-appborder p-4 rounded-3xl group hover:border-appborderhover transition-all">
                    <p class="text-[9px] uppercase font-bold text-appgreen tracking-wider">Safe Lifecycles</p>
                    <div class="flex justify-between items-baseline mt-1">
                        <p id="stat-grade-safe" class="text-3xl font-black text-appgreen tracking-tight">0</p>
                        <span class="text-[10px] text-gray-500 font-apple">&gt; 3 Bln</span>
                    </div>
                </div>
            </div>

            <!-- LAYOUT GRIDS: Kiri (7 Kolom), Kanan (5 Kolom) -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                
                <!-- SISI KIRI (7 Kolom): Traceability + DC Feed Langsung Di Bawahnya untuk Mengisi Ruang Kosong -->
                <div class="lg:col-span-7 space-y-6">
                    
                    <!-- 1. BATCH CONTROLS -->
                    <div class="space-y-3">
                        <div class="bg-appcard border border-appborder p-4 rounded-3xl flex justify-between items-center">
                            <h4 class="text-xs font-black text-white uppercase tracking-wider flex items-center gap-2">
                                <span class="h-1.5 w-1.5 rounded-full bg-apporange animate-pulse"></span>
                                Chronological Traceability Stream
                            </h4>
                            <div class="flex bg-white/5 p-0.5 rounded-lg border border-white/5 text-[10px] font-bold">
                                <button onclick="switchTab('crit')" id="btn-tab-crit" class="px-3 py-1 rounded-md bg-appred/20 text-appred transition-all">Critical</button>
                                <button onclick="switchTab('safe')" id="btn-tab-safe" class="px-3 py-1 rounded-md text-gray-400 transition-all">Safe</button>
                            </div>
                        </div>
                        
                        <div id="group-crit" class="space-y-3"></div>
                        <div id="group-safe" class="space-y-3 hidden-tab"></div>
                    </div>

                    <!-- 2. NETWORK DISTRIBUTION FEED (Pindah ke sini agar mengisi ruang kosong ke bawah secara horizontal) -->
                    <div class="space-y-3 pt-2">
                        <div class="flex items-center justify-between px-1">
                            <h4 class="text-xs font-black uppercase tracking-wider text-gray-400 flex items-center gap-2">
                                <i class="fa-solid fa-server text-appaccent"></i>
                                Network Distribution Feed
                            </h4>
                        </div>
                        <!-- Membuat layout DC otomatis melebar 2 kolom di area kiri ini -->
                        <div id="diagnosa-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
                    </div>
                </div>

                <!-- SISI KANAN (5 Kolom): Indeks Tabel Kesehatan Stok -->
                <div class="lg:col-span-5">
                    <div class="bg-appcontrast text-black rounded-3xl border border-white/10 overflow-hidden shadow-lg">
                        <div class="bg-black/[0.02] px-4 py-3 border-b border-black/[0.06] flex justify-between items-center">
                            <h4 class="text-[10px] font-black text-black uppercase tracking-wider flex items-center gap-1.5">
                                <i class="fa-solid fa-chart-bar text-black/60"></i> Stock Health Index
                            </h4>
                            <span class="text-[8px] font-black bg-black text-white px-2 py-0.5 rounded tracking-widest uppercase">QC READOUT</span>
                        </div>
                        
                        <div class="overflow-x-auto">
                            <table class="w-full text-[11px] font-apple text-left">
                                <thead>
                                    <tr class="border-b border-black/[0.04] text-[9px] text-black/40 font-black tracking-wider uppercase text-center bg-black/[0.01]">
                                        <th class="px-4 py-2 text-left">NAMA SKU</th>
                                        <th class="py-2">AVG 3M</th>
                                        <th id="th-forecast" class="py-2 text-black/80 font-extrabold">FCST</th>
                                        <th id="th-buffer" class="py-2 text-appred font-extrabold">BUFF</th>
                                        <th class="px-4 py-2">STATUS</th>
                                    </tr>
                                </thead>
                                <tbody id="forecast-container" class="divide-y divide-black/[0.03]"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- CORE INTERACTION DATA LOGIC -->
    <script>
        const WEBHOOK_URL = "https://n8n-mzbmiib3etk4.kangkung.sumopod.my.id/webhook/ff-indonesia-api";

        document.addEventListener('DOMContentLoaded', () => {
            if(!localStorage.getItem('ffi_user')) { window.location.href = 'index.html'; return; }
            updateMonthHeaders(); setTimeout(() => { loadAnalytics(); }, 100);
        });

        function updateMonthHeaders() {
            const months = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"]; const d = new Date();
            document.getElementById('th-buffer').innerHTML = `BUFF<span class="block text-[7px] font-normal text-black/40">(${months[d.getMonth()]})</span>`; 
            document.getElementById('th-forecast').innerHTML = `FCST<span class="block text-[7px] font-normal text-black/40">(${months[(d.getMonth() + 1) % 12]})</span>`;
        }

        function switchTab(type) {
            const critGrp = document.getElementById('group-crit');
            const safeGrp = document.getElementById('group-safe');
            const btnCrit = document.getElementById('btn-tab-crit');
            const btnSafe = document.getElementById('btn-tab-safe');
            
            if(type === 'crit') {
                critGrp.classList.remove('hidden-tab'); safeGrp.classList.add('hidden-tab');
                btnCrit.className = "px-3 py-1 rounded-md bg-appred/20 text-appred transition-all";
                btnSafe.className = "px-3 py-1 rounded-md text-gray-400 transition-all";
            } else {
                safeGrp.classList.remove('hidden-tab'); critGrp.classList.add('hidden-tab');
                btnSafe.className = "px-3 py-1 rounded-md bg-appgreen/20 text-appgreen transition-all";
                btnCrit.className = "px-3 py-1 rounded-md text-gray-400 transition-all";
            }
        }

        function getPremiumSkeleton(count, isLargeCard=false) { 
            if(isLargeCard) {
                return Array(count).fill(`
                    <div class="skeleton-pulse-card rounded-2xl p-4 h-24 w-full mb-1 flex flex-col justify-between">
                        <div class="h-3 bg-white/5 rounded w-1/4"></div>
                        <div class="h-5 bg-white/5 rounded-xl w-full"></div>
                    </div>
                `).join('');
            }
            return Array(count).fill(`
                <div class="skeleton-pulse-card rounded-lg h-9 w-full mb-1.5"></div>
            `).join(''); 
        }

        async function loadAnalytics() {
            const icn = document.getElementById('sync-icon'); icn.classList.add('fa-spin');
            const fCont = document.getElementById('forecast-container'); const dCont = document.getElementById('diagnosa-container'); 
            const contCrit = document.getElementById('group-crit'); const contSafe = document.getElementById('group-safe');
            
            fCont.innerHTML = `<tr><td colspan="5" class="p-4">${getPremiumSkeleton(4)}</td></tr>`; 
            dCont.innerHTML = getPremiumSkeleton(4, true); 
            contCrit.innerHTML = getPremiumSkeleton(1, true); 
            contSafe.innerHTML = getPremiumSkeleton(1, true);
            
            try {
                const [reqBuffer, reqDiag, reqStock, reqLog] = await Promise.allSettled([ 
                    fetch(WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: "load_buffer" }) }), 
                    fetch(WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: "load_diagnose" }) }),
                    fetch(WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: "get_db_stock" }) }),
                    fetch(WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: "load_admin" }) })
                ]);
                
                // 1. Indeks Stok
                fCont.innerHTML = ''; let skuCount = 0;
                if(reqBuffer.status === 'fulfilled') {
                    let r = await reqBuffer.value.json(); let d = Array.isArray(r) ? r[0].data || r : r.data;
                    (Array.isArray(d) ? d : [d]).forEach((item, idx) => {
                        const row = item.json || item; const vals = Object.values(row); let sku = row.col_2 || vals[1];
                        if(!sku || String(sku).includes("NAMA SKU") || String(sku).includes("col_")) return;
                        const st = String(row.col_6 || vals[5] || ""); skuCount++;
                        
                        const indicatorDot = st.includes("CRITICAL") 
                            ? '<span class="h-2 w-2 rounded-full bg-appred inline-block shadow-[0_0_6px_#FF453A] animate-pulse"></span>' 
                            : '<span class="h-2 w-2 rounded-full bg-appgreen inline-block"></span>';
                            
                        fCont.innerHTML += `
                        <tr class="text-center font-apple text-black/80 hover:bg-black/[0.02] transition-colors animate-premium-fade" style="animation-delay:${idx*15}ms; opacity:0">
                            <td class="px-4 py-2.5 font-bold text-left text-black truncate max-w-[110px]">${sku}</td>
                            <td class="py-2.5 text-black/40 font-medium">${Math.round(Number(row.col_3||vals[2]||0))}</td>
                            <td class="py-2.5 font-bold text-black/90">${Math.round(Number(row.col_4||vals[3]||0))}</td>
                            <td class="py-2.5 font-black text-appred">${Math.round(Number(row.col_5||vals[4]||0))}</td>
                            <td class="px-4 py-2.5 flex justify-center items-center h-full">${indicatorDot}</td>
                        </tr>`;
                    });
                } document.getElementById('stat-sku').innerText = skuCount;

                // 2. Batch Processing
                let cCrit=0, cSafe=0; let htmlCrit = ""; let htmlSafe = "";
                let logData = [];
                if(reqLog.status === 'fulfilled') { let r = await reqLog.value.json(); logData = Array.isArray(r) ? r[0].data || r : r.data; }
                
                if(reqStock.status === 'fulfilled') {
                    let r = await reqStock.value.json(); let d = Array.isArray(r) ? r[0].data || r : r.data;

                    (Array.isArray(d) ? d : [d]).forEach((item, idx) => {
                        const row = item.json || item; 
                        const batchName = row["Nama Batch"] || row.nama_batch || row.col_2; 
                        const expDateStr = row["Tanggal Expired"] || row.tanggal_exp || row.col_3;
                        if(!batchName || String(batchName).toUpperCase() === 'NAMA BATCH') return;
                        
                        let expDate = expDateStr.includes('/') ? new Date(expDateStr.split('/')[2], expDateStr.split('/')[1]-1, expDateStr.split('/')[0]) : new Date(expDateStr);
                        const now = new Date(); 
                        let sisaBulan = 99;
                        if(!isNaN(expDate)) {
                            sisaBulan = (expDate.getFullYear() - now.getFullYear()) * 12 - now.getMonth() + expDate.getMonth();
                        }
                        
                        let isCritical = sisaBulan <= 3;
                        let badgeBorder = isCritical ? "bg-appred/10 text-appred border-appred/10" : "bg-appgreen/10 text-appgreen border-appgreen/10";
                        let warningText = sisaBulan <= 0 ? "EXPIRED" : `${sisaBulan} Bln`;
                        let locChipBg = isCritical ? "bg-appred/10 text-appred border border-appred/20" : "bg-appgreen/20 text-appgreen border border-appgreen/30 font-bold";

                        let skusInBatch = [];
                        if(Number(row.NKA || row.nka || 0) > 0) skusInBatch.push("NKA");
                        if(Number(row.NDLH || row.ndlh || 0) > 0) skusInBatch.push("NDLH");
                        if(Number(row.NRD || row.nrd || 0) > 0) skusInBatch.push("NRD");
                        if(Number(row.NARR || row.narr || 0) > 0) skusInBatch.push("NARR");
                        if(Number(row.NKACH || row.nkach || 0) > 0) skusInBatch.push("NKACH");

                        let skuHtml = skusInBatch.length > 0 
                            ? `<div class="flex flex-wrap gap-1 mt-1">${skusInBatch.map(s => `<span class="bg-white/5 text-white/70 text-[8px] px-2 py-0.5 rounded border border-white/5 font-bold">${s}</span>`).join('')}</div>`
                            : `<span class="text-[8px] text-gray-600 italic">No SKU data</span>`;

                        let locs = [];
                        logData.forEach(l => { if((l.BATCHES || l.batches || "").includes(batchName) && l.DC && !locs.includes(l.DC)) locs.push(l.DC); });
                        let locH = locs.length ? `<div class="flex flex-wrap gap-1 mt-1">${locs.map(dc => `<span class="${locChipBg} text-[8px] px-2 py-0.5 rounded tracking-wide uppercase">${dc}</span>`).join('')}</div>` : `<span class="text-[8px] text-gray-600 italic">No DC logs</span>`;

                        let cardHtml = `
                        <div class="bg-appcard p-4 rounded-3xl border border-appborder flex flex-col justify-between group hover:border-appborderhover transition-all animate-premium-fade shadow" style="animation-delay:${idx*10}ms; opacity:0">
                            <div class="grid grid-cols-12 items-start gap-2">
                                <div class="col-span-8">
                                    <p class="text-[8px] text-gray-500 font-bold uppercase tracking-wider">Reference Batch</p>
                                    <h4 class="font-black text-md text-white uppercase group-hover:text-appaccent transition-colors">${batchName}</h4>
                                    <p class="text-[9px] text-gray-400 mt-0.5">Deadline: <span class="text-white font-medium">${expDateStr}</span></p>
                                </div>
                                <div class="col-span-4 flex justify-end">
                                    <span class="px-2 py-0.5 rounded border ${badgeBorder} text-[9px] font-black uppercase tracking-wide bg-black/10">${warningText}</span>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-4 border-t border-white/5 pt-2.5 mt-2.5">
                                <div>
                                    <p class="text-[8px] text-gray-500 font-bold uppercase tracking-wider">📦 SKUs</p>
                                    ${skuHtml}
                                </div>
                                <div>
                                    <p class="text-[8px] text-gray-500 font-bold uppercase tracking-wider">📍 DC Location</p>
                                    ${locH}
                                </div>
                            </div>
                        </div>`;

                        if(isCritical) { htmlCrit += cardHtml; cCrit++; } 
                        else { htmlSafe += cardHtml; cSafe++; }
                    });
                    
                    contCrit.innerHTML = htmlCrit || `<div class="p-6 text-center border border-dashed border-appborder rounded-3xl"><p class="text-gray-500 text-xs uppercase tracking-wider">✨ Zero Critical Lifecycles</p></div>`;
                    contSafe.innerHTML = htmlSafe || `<div class="p-6 text-center border border-dashed border-appborder rounded-3xl"><p class="text-gray-500 text-xs uppercase tracking-wider">No Operational Lifecycles Active</p></div>`;
                }
                document.getElementById('stat-grade-crit').innerText = cCrit; document.getElementById('stat-grade-safe').innerText = cSafe;

                // 3. Network Distribution Render
                dCont.innerHTML = ''; let dcCount = 0;
                if(reqDiag.status === 'fulfilled') {
                    let r = await reqDiag.value.json(); let d = Array.isArray(r) ? r[0].data || r : r.data;
                    (Array.isArray(d) ? d : [d]).forEach((item, idx) => {
                        const row = item.json || item; const dc = row.dc || row.col_2; if(!dc || dc.includes("DIAGNOSE")) return;
                        dcCount++; const res = String(row.res || row.col_9 || "").toUpperCase();
                        
                        let badgeColor = "bg-apporange/10 text-apporange border-apporange/20"; 
                        if(res.includes("FAIL")) badgeColor = "bg-appred/10 text-appred border-appred/20"; 
                        else if(res.includes("ABOVE")||res.includes("SAFE")) badgeColor = "bg-appgreen/10 text-appgreen border-appgreen/20";
                        
                        dCont.innerHTML += `
                        <div class="bg-appcard p-4 rounded-3xl border border-appborder group hover:border-appborderhover transition-all animate-premium-fade shadow" style="animation-delay:${idx*10}ms; opacity:0">
                            <div class="flex justify-between items-center mb-2 gap-2">
                                <h4 class="text-xs font-black text-white truncate max-w-[130px] group-hover:text-appaccent transition-colors">${dc}</h4>
                                <span class="text-[8px] font-black ${badgeColor} border px-2 py-0.5 rounded uppercase bg-black/10 shrink-0">${res}</span>
                            </div>
                            
                            <div class="grid grid-cols-3 text-center bg-black/20 border border-white/5 py-1.5 rounded-xl text-[10px]">
                                <div class="border-r border-white/5">
                                    <p class="text-[7px] text-gray-500 uppercase tracking-wide">Fail Matrix</p>
                                    <p class="font-black text-appred mt-0.5">${row.failPct||Math.round((row.col_4||0)*100)}%</p>
                                </div>
                                <div class="border-r border-white/5">
                                    <p class="text-[7px] text-gray-500 uppercase tracking-wide">Under Buff</p>
                                    <p class="font-black text-apporange mt-0.5">${row.moqPct||Math.round((row.col_6||0)*100)}%</p>
                                </div>
                                <div>
                                    <p class="text-[7px] text-gray-500 uppercase tracking-wide">Above Tgt</p>
                                    <p class="font-black text-appgreen mt-0.5">${row.abovePct||Math.round((row.col_8||0)*100)}%</p>
                                </div>
                            </div>
                        </div>`;
                    });
                } document.getElementById('stat-dc').innerText = dcCount;

            } catch(e) { console.error(e); } finally { icn.classList.remove('fa-spin'); }
        }
    </script>
</body>
</html>
